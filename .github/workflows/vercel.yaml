name: Vercel Deployment

# One Vercel project hosts the docs site. The env switcher inside the
# site is the user-facing selection between dev / alpha / beta / final —
# the four ovok-docs branches all deploy into the SAME project:
#
#   final           → production deployment (docs.ovok.com)
#   dev/alpha/beta  → preview deployments (auto-named by Vercel)
#
# Skip-if-missing: workflow stays green even before VERCEL_TOKEN /
# VERCEL_ORG_ID / VERCEL_PROJECT_ID are configured — it just logs a
# warning and exits the deploy step.

on:
  push:
    branches: [dev, alpha, beta, final]
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Vercel creds + deploy target
        id: vercel
        env:
          VT:     ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PID:    ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          MISSING=""
          [ -z "$VT" ]     && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "$ORG_ID" ] && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "$PID" ]    && MISSING="$MISSING VERCEL_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::warning::Skipping Vercel deploy for $GITHUB_REF_NAME — missing:$MISSING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # final is the production branch; dev/alpha/beta become previews.
          if [ "$GITHUB_REF_NAME" = "final" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi
          echo "VERCEL_PROJECT_ID=$PID"   >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$ORG_ID"    >> "$GITHUB_ENV"
          echo "skip=false"               >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.vercel.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        if: steps.vercel.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        if: steps.vercel.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (${{ steps.vercel.outputs.target }})
        if: steps.vercel.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm add -g vercel@latest
          if [ "${{ steps.vercel.outputs.target }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
