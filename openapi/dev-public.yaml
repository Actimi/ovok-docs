        effectiveRespiratoryRate:
          type: number
          nullable: true
        effectiveSleepStatus:
          type: string
      required:
        - lastUpdatedMs
        - effectiveHeartRate
        - effectiveRespiratoryRate
        - effectiveSleepStatus
