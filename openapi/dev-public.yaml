              code:
                type: string
                enum:
                  - invalid
                  - structure
                  - required
                  - value
                  - invariant
                  - security
                  - login
                  - unknown
                  - expired
                  - forbidden
                  - suppressed
                  - processing
                  - not-supported
                  - duplicate
                  - multiple-matches
                  - not-found
                  - deleted
                  - too-long
                  - code-invalid
                  - extension
                  - too-costly
                  - business-rule
                  - conflict
                  - transient
                  - lock-error
                  - no-store
                  - exception
                  - timeout
                  - incomplete
                  - throttled
                  - informational
                description: Code.
              details:
                type: object
                properties:
                  text:
                    type: string
                    description: Outcome description.
                required:
                  - text
                description: Outcome details.
            required:
              - severity
              - code
              - details
      required:
        - issue
      example:
        resourceType: OperationOutcome
        issue:
          - severity: information
            code: informational
            details:
              text: OK
