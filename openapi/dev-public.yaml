                  error:
                    type: string
                    example: Unauthorized
                required:
                  - statusCode
                  - message
        "404": &a72
          description: The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                  error:
                    type: string
                    example: Not Found
                required:
                  - statusCode
                  - message
        "422": &a73
