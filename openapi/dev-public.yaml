    ObservationTimeseriesResponseDto:
      type: object
      properties:
        observationId:
          type: string
        effectiveStart:
          type: string
          description: ISO-8601 anchor for the first sample (t0).
        periodMs:
          type: number
          description: Milliseconds between consecutive samples.
        series:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                nullable: true
                description: For component-bearing Observations the component primary code
                  (LOINC etc.). Null for series taken from the root SampledData.
              unit:
                type: string
                nullable: true
                description: Display unit from SampledData.origin.unit.
              origin:
                type: number
                description: Base value (data points are added to this after factor scaling).
              dimension:
                type: integer
                description: Which interleaved dimension this series represents.
                  0..dimensions-1.
              count:
                type: integer
              points:
                type: array
                items:
                  type: object
                  properties:
                    t:
                      type: string
                      description: ISO-8601 UTC timestamp for this sample.
                    v:
                      oneOf:
                        - type: number
                        - type: string
                          enum:
                            - E
                        - type: string
                          enum:
                            - L
                        - type: string
                          enum:
                            - U
                      description: Numeric value after factor + origin offset are applied, or a
                        preserved E/L/U token from the source SampledData.
                  required:
                    - t
                    - v
            required:
              - code
              - unit
              - origin
              - dimension
              - count
              - points
      required:
        - observationId
        - effectiveStart
        - periodMs
        - series
      description: Expanded {timestamp, value} view of an Observation's SampledData.
        Returned when GET Observation/:id is called with ?asTimeseries=true. One
        entry per (component × dimension) combination; the root SampledData (if
        any) emits one entry with code=null.
    DeviceTelemetryHistoryResponseDto:
      type: object
      properties:
        deviceId:
          type: string
          description: FHIR Device id whose telemetry history was queried.
        patientId:
          type: string
          description: FHIR Patient id linked to the Device.
        signalsPatientId:
          type: string
          description: Internal Signals patient id used to fetch the history.
      required:
        - deviceId
        - patientId
        - signalsPatientId
      additionalProperties: true
      description: Observation history for a Device, fetched via the Signals service.
        Defaults to the last 72 hours when `from`/`to` are omitted. Pagination
        and shape beyond the three fixed ids depend on the upstream Signals
        response.
      example:
        deviceId: 87ea5dfc-8b8e-384d-8489-79496e706390
        patientId: 87ea5dfc-8b8e-384d-8489-79496e706390
        signalsPatientId: signals-abc-123
        page: 1
        pageSize: 100
        total: 4
        entries:
          - resourceType: Observation
            status: final
            code:
              coding:
                - system: http://loinc.org
                  code: 8867-4
                  display: Heart rate
            effectiveInstant: 2026-04-22T10:00:00.000Z
            valueQuantity:
              value: 72
              unit: beats/min
    PatientResponseDto:
      type: object
      properties:
        resourceType:
          type: string
          enum:
            - Patient
        id:
          type: string
      required:
        - resourceType
        - id
      additionalProperties: true
      description: A FHIR Patient resource as stored in the FHIR API. When created
        with `?withSignals=true` the resource is re-read after Signals
        provisioning so any identifiers stamped by the link step are reflected.
      example:
        resourceType: Patient
        id: 87ea5dfc-8b8e-384d-8489-79496e706390
        meta:
