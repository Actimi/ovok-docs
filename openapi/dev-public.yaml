          type: object
          example: 2026-04-12T17:21:21.410Z
          nullable: true
      required:
        - ok
    RedisHealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
      description: Redis ping result. `false` when the Redis instance is unreachable.
    FhirServerHealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
          description: FHIR server build version.
        platform:
          type: string
          description: Host platform (linux, darwin, …).
        runtime:
          type: string
          description: Node.js runtime version.
        postgres:
          type: boolean
        redis:
          type: boolean
      required:
        - ok
        - version
        - platform
        - runtime
        - postgres
        - redis
      description: FHIR server health summary, including its own Postgres/Redis status
        checks.
    EmailHealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
        skipped:
          type: boolean
          description: "`true` when the email provider is not configured for this
            deployment — `ok` reflects that no provider is wired, not an
            outage."
      required:
        - ok
      description: Email service health.
    WorkerStatsResponseDto:
      type: object
      properties:
        workerCount:
          type: integer
        workers:
          type: array
          items:
            type: object
            properties:
              pid:
                type: integer
              workerId:
                type: integer
              cpuPercent:
                type: number
              heapUsedMb:
                type: number
              rssMb:
                type: number
            required:
              - pid
              - workerId
              - cpuPercent
              - heapUsedMb
              - rssMb
        totals:
          type: object
          properties:
            cpuPercent:
              type: number
            heapUsedMb:
              type: number
            rssMb:
              type: number
          required:
            - cpuPercent
            - heapUsedMb
            - rssMb
      required:
        - workerCount
        - workers
        - totals
      description: Per-worker CPU/memory snapshot aggregated from Redis. Each worker
        self-reports every 10s. Disabled in production (returns 404).
    QueueStatsResponseDto:
      type: object
      additionalProperties:
        type: object
        properties:
          waiting:
            type: integer
          active:
            type: integer
          delayed:
            type: integer
          failed:
            type: integer
        required:
          - waiting
          - active
          - delayed
          - failed
      description: BullMQ queue depths keyed by queue name. Polled by k6 to track
        backend queue depth during load tests. Disabled in production (returns
