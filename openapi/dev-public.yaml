    InvoicesResponseDto:
      discriminator:
        propertyName: mode
      oneOf:
        - type: object
          properties:
            mode:
              type: string
              enum:
                - internal
            hasMore:
              type: boolean
              enum:
                - false
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: string
                    nullable: true
                  status:
                    type: string
                    nullable: true
                  amountDue:
                    type: integer
                    description: Amount due in the smallest currency unit (cents for USD).
                  amountPaid:
                    type: integer
                    description: Amount paid in the smallest currency unit.
                  currency:
                    type: string
                    description: ISO-4217 lowercase currency code, as returned by Stripe.
                  createdAt:
                    type: string
                    description: ISO-8601 UTC timestamp.
                  periodStart:
                    type: string
                    nullable: true
                    description: Billing period start (ISO-8601) or null when Stripe omitted it.
                  periodEnd:
                    type: string
                    nullable: true
                    description: Billing period end (ISO-8601) or null when Stripe omitted it.
                  hostedInvoiceUrl:
                    type: string
                    nullable: true
                    description: Login-gated Stripe-hosted invoice page. Null until Stripe finalizes
                      the invoice.
                  invoicePdf:
                    type: string
                    nullable: true
                    description: Direct PDF link (also login-gated through Stripe).
                required:
                  - id
                  - number
                  - status
                  - amountDue
                  - amountPaid
                  - currency
                  - createdAt
                  - periodStart
                  - periodEnd
                  - hostedInvoiceUrl
                  - invoicePdf
              minItems: 0
              maxItems: 0
          required:
            - mode
            - hasMore
            - data
        - type: object
          properties:
            mode:
              type: string
              enum:
                - stripe
            hasMore:
              type: boolean
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: string
                    nullable: true
                  status:
                    type: string
                    nullable: true
                  amountDue:
                    type: integer
                    description: Amount due in the smallest currency unit (cents for USD).
                  amountPaid:
                    type: integer
                    description: Amount paid in the smallest currency unit.
                  currency:
                    type: string
                    description: ISO-4217 lowercase currency code, as returned by Stripe.
                  createdAt:
                    type: string
                    description: ISO-8601 UTC timestamp.
                  periodStart:
                    type: string
                    nullable: true
                    description: Billing period start (ISO-8601) or null when Stripe omitted it.
                  periodEnd:
                    type: string
                    nullable: true
                    description: Billing period end (ISO-8601) or null when Stripe omitted it.
                  hostedInvoiceUrl:
                    type: string
                    nullable: true
                    description: Login-gated Stripe-hosted invoice page. Null until Stripe finalizes
                      the invoice.
                  invoicePdf:
                    type: string
                    nullable: true
                    description: Direct PDF link (also login-gated through Stripe).
                required:
                  - id
                  - number
                  - status
                  - amountDue
                  - amountPaid
                  - currency
                  - createdAt
                  - periodStart
                  - periodEnd
                  - hostedInvoiceUrl
                  - invoicePdf
          required:
            - mode
            - hasMore
            - data
