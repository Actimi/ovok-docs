    get:
      description: >-
        Returns the caller project's place in the project hierarchy: its own id,
        its parent's id (if any), and the ids of any direct children.


        The dashboard renders this on the project switcher; SDK consumers use it
        to navigate between tenants the caller has access to without minting
        separate credentials.


        ### Example


        ```bash

        curl '<APP_BASE_URL>/v1/sub-project' \
          -H 'Authorization: Bearer <admin-token>'
        ```


        Returns the relationship graph as a `SubProjectsResponseDto`. 400 when
        no project is bound to the session.
      operationId: SubProjectController_getProjectRelationships
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubProjectsResponseDto"
        "400": *a23
        "401": *a24
        "404": *a25
        "422": *a26
        "500": *a27
      summary: List project relationships
      tags:
        - Sub Projects
  /sub-project/{subProjectId}:
    delete:
      description: >-
        Tear down a child project. The FHIR Project resource and the parent ↔
        child relationship are both removed.


        **Irreversible.** All resources stored on the child project (Patients,
        Practitioners, Observations, …) are removed from the active dataset.
        There is no soft-delete; if you need history, snapshot the child via the
        FHIR API before calling.


        Admin-only. Only the parent project may delete a child it owns —
        cross-tenant attempts return 404 (same as "not found", to avoid leaking
        existence).


        ### Example


        ```bash

        curl -X DELETE '<APP_BASE_URL>/v1/sub-project/<sub-project-id>' \
          -H 'Authorization: Bearer <admin-token>'
        ```
      operationId: SubProjectController_deleteSubTenant
      parameters:
        - name: subProjectId
          required: true
          in: path
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          description: The sub tenant was deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubProjectSuccessResponseDto"
        "400": *a23
        "401": *a24
        "404": *a25
        "422": *a26
        "500": *a27
      summary: Delete a sub tenant
      tags:
        - Sub Projects
