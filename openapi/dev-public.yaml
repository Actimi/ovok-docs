        - bearer: []
      summary: Generate credentials for document file replacement
      tags:
        - Document
  /bots:
    post:
      description: >
        This API executes a bot by its identifier.

        <br>Additional parameters can be provided in the request body.


        ## Example bot resource


        ```json

        {
          "resourceType": "Bot",
          "identifier": [{
            "system": "https://example.com",
            "value": "get-users"
          }],
          ...
        }

        ```


        ## Example cURL request


        The bot identifier is provided in the query, while additional parameters
        are sent in the JSON body.


        ```bash

        curl -X POST \
         --url 'https://api.dev.ovok.com/bots?identifier=https://example.com|get-users' \
         -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3MzEzMzY0NDIsImV4cCI6MTczMTM0MDA0Mn0.MQbovtK2tKu8Zj6_7vaqSVXWunIG8-iuwa6JEXCqXAQ' \
         -H 'Content-Type: application/json' \
         -d '{
            "parameter1": "value1",
            "parameter2": "value2"
        }'

        ```


        **Note**: The `https://example.com|get-users` query parameter value
        consists of identifier's `system` and `value` properties merged by a
        single pipe `|` symbol, following the FHIR search parameter syntax.
      operationId: BotsController_execBotByIdentifierPOST
      parameters:
        - name: identifier
          required: true
          in: query
          description: Bot identifier in FHIR `system|value` form (e.g.
            `https://example.com|get-users`); the `system` half may be omitted.
            The request body is forwarded to the bot as its input.
          schema:
            type: string
      responses:
        "200":
          description: Bot response (shape depends on the bot).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotExecResponseDto"
        "400":
          description: The request could not be operated by the server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: string
                  error:
                    type: string
                    example: Bad Request
                required:
                  - statusCode
                  - message
        "401":
          description: The resource owner or authorization server denied the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
                  error:
                    type: string
                    example: Unauthorized
                required:
                  - statusCode
                  - message
        "404":
          description: The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                  error:
                    type: string
                    example: Not Found
                required:
                  - statusCode
                  - message
        "422":
          description: The request could not be validated by the server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 422
                  message:
                    type: string
                  error:
                    type: string
                    example: Unprocessable Entity
                required:
                  - statusCode
                  - message
        "500":
          description: The server encountered an unexpected condition. Please try again
            later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                  error:
                    type: string
                    example: Internal Server Error
                required:
                  - statusCode
                  - message
