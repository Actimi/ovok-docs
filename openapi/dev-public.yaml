  /v1/wearables/{provider}/connect:
    post:
      description: >-
        **Early Access** — interfaces may change without notice.


        Generates the provider authorization URL the dashboard should send the
        user to. The user authenticates with the provider (Strava, Polar, …),
        the provider redirects back to `/v1/wearables/:provider/callback`, and
        at that point we exchange the code, persist the tokens on a FHIR
        Endpoint resource, and (optionally) bounce the user to a dashboard URL
        of your choice.


        ### Prerequisites


        1. The matching project-setting toggle must be ON
        (`WEARABLE_STRAVA_ENABLED` or `WEARABLE_POLAR_ENABLED`). See `PUT
        /v1/project/settings/:key`.

        2. The provider's OAuth app credentials must be on file in
        `Project.systemSecret[]`:
            - Strava: `WEARABLE_STRAVA_CLIENT_ID`, `WEARABLE_STRAVA_CLIENT_SECRET`, `WEARABLE_STRAVA_WEBHOOK_SECRET`
            - Polar: `WEARABLE_POLAR_CLIENT_ID`, `WEARABLE_POLAR_CLIENT_SECRET`, `WEARABLE_POLAR_WEBHOOK_SECRET`
           Issue them in the provider's developer portal first, then paste into project settings (admin only).
        3. The provider's redirect URI registration must point at
        `<APP_BASE_URL>/v1/wearables/:provider/callback`.


        ### Example


        ```bash

        curl -X POST '<APP_BASE_URL>/v1/wearables/strava/connect' \
          -H 'Authorization: Bearer <token>' \
          -H 'Content-Type: application/json' \
          -d '{ "patientId": "<patient-uuid>", "redirectUri": "https://my.dashboard/connect-done" }'
        ```


        Response carries an `authorizationUrl` you redirect the user to.
      operationId: WearablesController_startConnect_v1
      parameters:
        - name: provider
          required: true
          in: path
          description: Wearable provider slug. Currently `strava` or `polar` — must match
            a slug enabled in `WearableProvider`.
          schema:
            enum:
              - strava
              - polar
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponseDto"
        "400": &a70
