      description: |
        Update document metadata

        Updates the name and/or publicity settings of an uploaded document.

        ### Parameters

        | Parameter  | In     | Description                                                                  | Example   |
        | ---------- | ------ | ---------------------------------------------------------------------------- | --------- |
        | `id`       | `path` | The id of the DocumentReference resource to update                           | `023f2f-` |
