        birthDate: 1815-12-10
        gender: female
    PatientThresholdResponseDto:
      type: object
      properties:
        resourceType:
          type: string
          enum:
            - CarePlan
          description: Patient thresholds are persisted as a FHIR CarePlan.
        id:
          type: string
        subject:
          type: object
          properties:
            reference:
              type: string
          required:
            - reference
          additionalProperties: true
      required:
        - resourceType
        - id
        - subject
      additionalProperties: true
      description: Persisted patient threshold configuration. Stored as a FHIR
        CarePlan whose detail extensions encode per-observation min/max bounds.
        When `?updateOnSignals=true` was sent, the same configuration has been
        pushed to Signals (failures are logged, not surfaced — the saved
        CarePlan is still returned).
