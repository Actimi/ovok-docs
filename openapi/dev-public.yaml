  /v1/public/cms/{typeSlug}/items:
    get:
      description: "List published items from a CMS collection. Authenticates with a
        project-scoped API key (Authorization: Bearer …). Drafts and unpublished
        items are filtered out server-side."
      operationId: PublicDeliveryController_listItems_v1
      parameters:
