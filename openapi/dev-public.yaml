    CmsApiKeyListResponseDto:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: Basic resource id holding this key.
          label:
            type: string
            description: Human-readable label set at issuance.
          prefix:
            type: string
            description: First few cleartext characters — surfaced so the dashboard can
              identify the key without storing the secret.
          createdAt:
            type: string
          lastUsedAt:
            type: string
            nullable: true
        required:
          - id
          - label
          - prefix
          - createdAt
          - lastUsedAt
      description: Issued CMS API keys for the caller’s current project. The cleartext
        secret is NEVER returned here — only `prefix` and `lastUsedAt` for
        identification.
    CmsApiKeyCreateResponseDto:
      type: object
      properties:
        key:
          type: object
          properties:
            id:
              type: string
              description: Basic resource id holding this key.
            label:
              type: string
              description: Human-readable label set at issuance.
            prefix:
              type: string
              description: First few cleartext characters — surfaced so the dashboard can
                identify the key without storing the secret.
            createdAt:
              type: string
            lastUsedAt:
              type: string
              nullable: true
          required:
            - id
            - label
            - prefix
            - createdAt
            - lastUsedAt
        secret:
          type: string
          description: Cleartext API key. Echoed back ONCE — store it now; it is not
            recoverable from the server afterwards.
      required:
        - key
        - secret
      description: Newly-issued CMS API key plus its one-time cleartext secret.
    PublicDeliveryListResponseDto:
      type: object
      properties:
        docs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable Payload item id.
              slug:
                type: string
                description: Slug for the item, when the collection defines a `slug` field.
              publishedAt:
                type: string
                description: ISO-8601 timestamp the item was last published. Items without this
                  field are filtered out of the response.
            required:
              - id
            additionalProperties: true
            description: Published CMS item. Shape is project- and collection-specific — the
              documented fields are the envelope guaranteed by the delivery API;
              everything else comes from the Payload collection schema.
            example: &a87
              id: 87ea5dfc-8b8e-384d-8489-79496e706390
              slug: welcome-banner
              publishedAt: 2026-05-01T12:00:00.000Z
              title: Welcome to Ovok
              body: Long-form content authored in the Console.
          description: Published items in the current page, oldest-first unless sorted
            otherwise.
        totalDocs:
          type: integer
          minimum: 0
          description: Total matching items across all pages.
        limit:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: Items per page (caller-supplied, capped at 100 server-side).
        totalPages:
          type: integer
          minimum: 0
          description: Total page count at the current limit.
        page:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: 1-indexed current page.
        pagingCounter:
          type: integer
          description: 1-indexed position of the first item on this page across the full
            result set.
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        nextPage:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          nullable: true
      required:
        - docs
        - totalDocs
        - limit
        - totalPages
        - page
      description: Paginated envelope of published items in a CMS collection. Items in
        `docs` follow the project-defined collection schema; the envelope fields
        (`totalDocs`, `limit`, `totalPages`, `page`) are fixed.
      example:
        docs:
          - id: 87ea5dfc-8b8e-384d-8489-79496e706390
            slug: welcome-banner
            publishedAt: 2026-05-01T12:00:00.000Z
            title: Welcome to Ovok
        totalDocs: 1
        limit: 20
        totalPages: 1
        page: 1
        pagingCounter: 1
        hasPrevPage: false
        hasNextPage: false
        prevPage: null
        nextPage: null
    PublicDeliveryItemResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Stable Payload item id.
        slug:
          type: string
          description: Slug for the item, when the collection defines a `slug` field.
        publishedAt:
          type: string
          description: ISO-8601 timestamp the item was last published. Items without this
            field are filtered out of the response.
      required:
        - id
      additionalProperties: true
      description: Published CMS item. Shape is project- and collection-specific — the
        documented fields are the envelope guaranteed by the delivery API;
        everything else comes from the Payload collection schema.
      example: *a87
    ProjectListResponseDto:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
                nullable: true
              parentProjectId:
                type: string
                nullable: true
              isAdmin:
                type: boolean
              isInternal:
                type: boolean
            required:
              - id
              - name
              - slug
              - parentProjectId
              - isAdmin
              - isInternal
      required:
        - projects
      description: All Medplum projects the caller is a member of.
    TenantCodeResponseDto:
      type: object
      properties:
        tenantCode:
          type: string
          nullable: true
          description: Short tenant code on file, or null when not assigned yet.
        projectId:
          type: string
      required:
        - tenantCode
        - projectId
      description: Tenant code lookup for the caller’s current project. Tenant codes
        are short, project-scoped identifiers used in URLs.
      example:
        tenantCode: acme
        projectId: 7cb8a325-…
    ProjectFeaturesResponseDto:
      type: object
      properties:
        features:
          type: array
          items:
            type: string
      required:
        - features
      description: Current project-level feature flags.
    ProjectFeaturesBodyDto:
      type: object
      properties:
        features:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 64
      required:
        - features
      description: "Replace the project-level Medplum feature flags. Common values:
        bots, cron, websocket-subscriptions, email, mfa, graphql-introspection,
        transaction-bundles. Empty array disables everything."
      example:
        features:
          - bots
          - cron
          - websocket-subscriptions
    CmsLocalesResponseDto:
      type: object
      properties:
        locales:
          type: array
          items:
            type: string
          description: BCP-47 codes ordered as configured. Empty when the project has none
            set yet.
        default:
          type: string
          description: The project default locale — equal to `locales[0]` (or "" when no
            locales are configured).
      required:
        - locales
        - default
      description: CMS locale configuration for the caller’s current project. Public
        content delivery falls back to `default` when a requested locale has no
        value on file.
      example:
        locales:
          - en
          - de
          - fr
        default: en
    CmsLocalesBodyDto:
      type: object
      properties:
        locales:
          type: array
          items:
            type: string
            pattern: ^[a-z]{2,3}(-[A-Za-z]{2,4})?$
          minItems: 1
          maxItems: 20
      required:
        - locales
      description: Replace the CMS locale list. BCP-47 codes (e.g. "en", "de",
        "pt-BR"). First entry becomes the project default.
      example:
        locales:
          - en
          - de
          - fr
