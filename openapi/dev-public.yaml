  /sub-project:
    post:
      description: >-
        Create a child project ("sub tenant") nested under the caller's current
        project. The admin issuing the request is automatically joined to the
        new child project as a Practitioner with admin rights, so the OAuth
        credentials they already hold keep working against it.


        Use this to spin up isolated environments per customer, per clinic, or
        per integration partner without minting new accounts. The parent project
        retains full read/write across all its children — child-project access
        policies stay scoped to the child.


        ### Body


        `SubProjectRequestBodyDto` — at minimum a `name`. See the schema below
        for optional metadata (`organizationName`, `accessPolicies`, etc.).


        ### Example


        ```bash

        curl -X POST '<APP_BASE_URL>/v1/sub-project' \
          -H 'Authorization: Bearer <admin-token>' \
          -H 'Content-Type: application/json' \
          -d '{ "name": "Acme — Berlin clinic" }'
        ```


        Admin-only. Returns `{ success: true }`.
      operationId: SubProjectController_createSubTenant
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubProjectRequestBodyDto"
      responses:
        "200":
          description: The sub tenant was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubProjectSuccessResponseDto"
        "400": &a23
