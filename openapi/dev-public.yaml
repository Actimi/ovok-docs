  /auth/session/{option}:
    delete:
      description: >
        The Delete Session API endpoint revokes session(s) from the Ovok
        platform. The access and refresh tokens for the sessions(s) will be
        invalidated.

        You can specify if you'd like to revoke `all`, `current`, `other` or a
        specific session by providing the session ID.


        ## Example cURL request


        ```bash

        curl -X DELETE \
         --url 'https://api.dev.ovok.com/auth/session/other' \
         -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3NzkyODUwNjUsImV4cCI6MTc3OTI4ODY2NX0.hWVqb9o_Bcix949tRWlNPQ36XFB1RuTGap56ovg1JKQ'
        ```
      operationId: AuthSessionController_revokeSessions
      parameters:
        - name: option
          required: true
          in: path
          description: Which sessions to revoke. Use `current` to revoke the calling
            session, `other` to revoke every session except the calling one,
            `all` to revoke every session, or a specific session UUID to revoke
            just that session.
          schema:
            oneOf:
              - type: string
                enum:
                  - current
                  - other
                  - all
              - type: string
                format: uuid
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponseDto"
        "400": *a1
        "401": *a2
        "404": *a3
        "422": *a4
        "500": *a5
      security: *a6
      summary: Revoke sessions
      tags:
        - Authentication - Session Management
