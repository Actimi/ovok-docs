  /v1/wearables/{provider}/callback:
    get:
      description: >-
        **Early Access** — interfaces may change without notice.


        Endpoint the provider redirects the user to after they authorize. The
        dashboard does not call this directly — the user's browser does, via a
        302 from the provider.


        We exchange the `code` query parameter for an access + refresh token
        pair, persist them as a FHIR `Endpoint` resource (encrypted, keyed on
        the project), then either redirect the browser to the `redirectUri` the
        dashboard supplied at connect time, or return a `200 { ok: true,
        provider, patientId }` JSON payload.


        ### Query parameters


        | Name                |
        Notes                                                               |

        | ------------------- |
        ------------------------------------------------------------------- |

        | `code`              | Authorization code returned by the provider.
        Required on success.   |

        | `state`             | Opaque CSRF token we minted at connect time.
        Required on success.   |

        | `error`             | Set when the user denied or the provider failed.
        We forward 400.    |

        | `error_description` | Human-readable error context
        (optional).                            |


        ### Notes


        The state token is single-use (Redis `GETDEL`) — replays return 401.
        State expires after 600 seconds; if the user takes longer to authorize,
        the flow must be restarted.
      operationId: WearablesController_oauthCallback_v1
      parameters:
        - name: provider
          required: true
          in: path
          description: Wearable provider slug. Must match the one passed to `/connect` —
            mismatch is rejected.
          schema:
            enum:
              - strava
              - polar
            type: string
        - name: error_description
          required: false
          in: query
          description: Optional human-readable error context from the provider.
          schema: {}
        - name: error
          required: false
          in: query
          description: Set by the provider when the user denied or the upstream OAuth
            failed. Forwarded as a 400.
          schema: {}
        - name: state
          required: false
          in: query
          description: Opaque CSRF token we minted at `/connect`. Single-use (Redis
            `GETDEL`). Replays return 401.
          schema: {}
        - name: code
          required: false
          in: query
          description: Authorization code returned by the provider on success. Exchanged
            server-side for tokens.
          schema: {}
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponseDto"
        "400": *a70
        "401": *a71
        "404": *a72
        "422": *a73
        "500": *a74
      summary: "[Early Access] Wearable OAuth callback"
      tags:
        - Wearables (Early Access)
