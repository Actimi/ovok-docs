  /v1/wearables/{provider}/webhook:
    get:
      description: >-
        **Early Access** — interfaces may change without notice.


        Verification handshake endpoint. Some providers (notably Strava) prove
        they own the callback URL by GETting it with a `hub.challenge` parameter
        and a `hub.verify_token` we agreed on at subscription time. We echo the
        challenge back if the verify token matches the platform-wide
        `WEARABLES_WEBHOOK_VERIFY_TOKEN` environment variable.


        You will hit this endpoint only when **first registering** a webhook
        subscription with the provider (e.g. via Strava's `POST
        /api/v3/push_subscriptions`). After that, the provider POSTs events to
        the same path — see [Wearable webhook ingress] below.


        ### Example response


        ```json

        { "hub.challenge": "<echoed verbatim>" }

        ```


        Returns `400` when the token does not match.
      operationId: WearablesController_webhookVerify_v1
      parameters:
        - name: provider
          required: true
          in: path
          description: Wearable provider slug. Verification handshake is currently used by
            `strava`.
          schema:
            enum:
              - strava
              - polar
            type: string
        - name: hub.verify_token
          required: true
          in: query
          description: Verify token agreed with the provider at subscription time. Must
            equal `WEARABLES_WEBHOOK_VERIFY_TOKEN`.
          schema: {}
        - name: hub.challenge
          required: true
          in: query
          description: Provider-supplied challenge string. Echoed back verbatim on a
            successful match.
          schema: {}
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponseDto"
        "400": *a70
        "401": *a71
        "404": *a72
        "422": *a73
        "500": *a74
      summary: "[Early Access] Wearable webhook subscription verification"
      tags:
        - Wearables (Early Access)
    post:
      description: >-
        **Early Access** — interfaces may change without notice.


        Endpoint the wearable provider POSTs activity / sleep / heart-rate
        events to. Not called by the dashboard — only by the provider's webhook
        delivery service.


        ### Per-provider behaviour


        **Strava** (`webhookPing` model):


        The payload contains only `{ object_type, object_id, aspect_type,
        owner_id }`. We follow up with `GET /api/v3/activities/{id}` using the
        connection's access token, map the result to a FHIR `Procedure` plus
        summary `Observation`s (distance, moving-time, kcal, average HR, max
        HR), and enqueue them for write.


        Signature verification: Strava does not HMAC-sign events. We accept the
        payload if (a) the structural shape is correct and (b) an optional
        `x-ovok-signature` HMAC header matches the configured
        `WEARABLE_STRAVA_WEBHOOK_SECRET` when present.


        **Polar** (`webhookStream` model):


        The payload contains the full event (`EXERCISE`, `SLEEP`,
        `CONTINUOUS_HEART_RATE`). `EXERCISE` maps to a Procedure plus summary
        Observations; `SLEEP` maps to a duration Observation on LOINC 93832-4.
        `CONTINUOUS_HEART_RATE` is currently a no-op and reserved for a future
        pass that writes `valueSampledData` so the stream renders via [GET
        /Observation/:id?asTimeseries=true].


        Signature verification: mandatory. Polar HMAC-SHA256-signs the raw body
        and sends the hex digest in the `polar-webhook-signature` header. We
        compare against `WEARABLE_POLAR_WEBHOOK_SECRET`; mismatches return 400.


        ### Routing


        The webhook arrives without project context. We look up the matching
        FHIR Endpoint resource cross-tenant by `(provider, remote_user_id)` —
        provider's user id is `owner_id` (Strava) or `user_id` (Polar). Webhook
        events for an unknown user are silently 200'd to stop the provider
        retrying after a revoke.


        ### Body


        `application/json` — raw provider payload. We parse it with the strategy
        and enqueue the result onto the `wearable-ingest` BullMQ queue, then 200
        quickly so the provider doesn't retry. FHIR writes happen off-thread.
      operationId: WearablesController_webhookIngress_v1
      parameters:
        - name: provider
          required: true
          in: path
          description: Wearable provider slug delivering the event. Provider-specific
            payload + signing rules apply (see description).
          schema:
            enum:
              - strava
              - polar
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponseDto"
        "400": *a70
        "401": *a71
        "404": *a72
        "422": *a73
        "500": *a74
      summary: "[Early Access] Wearable webhook ingress"
      tags:
        - Wearables (Early Access)
  /v1/project/settings:
    get:
      description: >-
        Returns every boolean setting on the caller's current project as a
        single map. Settings drive opt-in features (Payload CMS, custom mailing,
        wearable integrations, patient registration policies, …).


        Defaults are applied for any setting the project has not explicitly set
        — see `PROJECT_SETTING_DEFAULTS` server-side. Admin only.


        ### Example


        ```bash

        curl '<APP_BASE_URL>/v1/project/settings' \
          -H 'Authorization: Bearer <admin-token>'
        ```
      operationId: ProjectSettingsController_getSettings_v1
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettingsResponseDto"
        "400": &a75
          description: The request could not be operated by the server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: string
                  error:
                    type: string
                    example: Bad Request
                required:
                  - statusCode
                  - message
        "401": &a76
          description: The resource owner or authorization server denied the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
                  error:
                    type: string
                    example: Unauthorized
                required:
                  - statusCode
                  - message
        "404": &a77
          description: The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 404
                  message:
                    type: string
                  error:
                    type: string
                    example: Not Found
                required:
                  - statusCode
                  - message
        "422": &a78
          description: The request could not be validated by the server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 422
                  message:
                    type: string
                  error:
                    type: string
                    example: Unprocessable Entity
                required:
                  - statusCode
                  - message
        "500": &a79
          description: The server encountered an unexpected condition. Please try again
            later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                  error:
                    type: string
                    example: Internal Server Error
                required:
                  - statusCode
                  - message
      security:
        - bearer: []
      summary: List project settings
      tags:
        - Project Settings
  /v1/project/settings/{key}:
    put:
      description: >-
        Flip a single boolean setting on the caller's current project. Some keys
        (`CONTENT_ENABLED`, `MAILING_ENABLED`) are paid-tier add-ons and return
        402 on Free; flipping them OFF is always allowed so a tier downgrade
        doesn't strand a project. Admin only.


        ### Body


        `{ "enabled": true | false }`


        ### Example


        ```bash

        curl -X PUT '<APP_BASE_URL>/v1/project/settings/WEARABLE_STRAVA_ENABLED'
        \
          -H 'Authorization: Bearer <admin-token>' \
          -H 'Content-Type: application/json' \
          -d '{ "enabled": true }'
        ```


        Returns the full updated settings map.
      operationId: ProjectSettingsController_putSetting_v1
      parameters:
        - name: key
          required: true
          in: path
          schema:
            type: string
            enum:
              - CONTENT_ENABLED
              - MAILING_ENABLED
              - PATIENT_INVITATION_ENABLED
              - PATIENT_REGISTRATION_ENABLED
              - PATIENT_LOGIN_ENABLED
              - PRACTITIONER_INVITATION_ENABLED
              - PRACTITIONER_REGISTRATION_ENABLED
              - PRACTITIONER_LOGIN_ENABLED
              - WEARABLE_STRAVA_ENABLED
              - WEARABLE_POLAR_ENABLED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutProjectSettingBodyDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettingsResponseDto"
        "400": *a75
        "401": *a76
        "404": *a77
        "422": *a78
        "500": *a79
      security:
        - bearer: []
      summary: Toggle a project setting
      tags:
        - Project Settings
info:
  title: Public APIs
  description: >-
    This is the public API for the OVOK platform. It contains all the public

    endpoints for the platform. This API is used by the web application and the

    mobile application. It is also used by the FHIR API to provide a high level

    interface to the FHIR resources. The FHIR API is a lower level API that
    provides

    direct access to the FHIR resources. Please refer to the FHIR API
    documentation [here](https://ovok.redocly.app) for more information.
  version: Latest
  contact: {}
tags:
  - name: Wearables (Early Access)
    description: >
      # Wearables — Early Access


      > 🚧  **Early Access** — interfaces, payload shapes, and supported
      providers may change without notice. Production use requires written
      sign-off from Ovok. Please report issues to wearables-feedback@ovok.com.


      Connect cloud wearable providers (Strava, Polar — more on the way) to your
      Ovok project. Once a patient authorizes, their activity, sleep, and
      heart-rate data lands as standard FHIR `Procedure` + `Observation`
      resources on your FHIR server, with LOINC coding so the existing FHIR
      search API is your unified read surface.


      ## How it fits together


      1. **Per-project toggle.** Each provider has a boolean in
      `Project.setting[]` — `WEARABLE_STRAVA_ENABLED`, `WEARABLE_POLAR_ENABLED`.
      Flip it on through `PUT /v1/project/settings/:key` (admin only).

      2. **Per-project OAuth credentials.** Paste the provider's client_id /
      client_secret / webhook_secret into `Project.systemSecret[]` via the
      project-settings dashboard. Encrypted at rest with the same envelope as
      MAIL_API_KEY.

      3. **Connect a patient.** `POST /v1/wearables/:provider/connect` returns
      an authorization URL — send the patient there.

      4. **Provider redirects back.** `GET /v1/wearables/:provider/callback`
      exchanges the code for tokens and writes a FHIR `Endpoint` resource on the
      project. Tokens are encrypted; the resource records (patient, provider,
      remote_user_id).

      5. **Data arrives via webhook.** `POST /v1/wearables/:provider/webhook`
      receives provider events, verifies the signature (per-provider scheme),
      maps to FHIR, and enqueues the writes onto the `wearable-ingest` BullMQ
      queue.

      6. **Read back via FHIR search.** Wearable observations are normal FHIR
      Observations — `GET /Observation?subject=Patient/:id&code=8867-4` returns
      HR samples regardless of which provider produced them.


      ## Provider-specific notes


      | Provider | OAuth quirks | Webhook delivery | Signature scheme |

      |---|---|---|---|

      | **Strava** | Refresh tokens **rotate** on every refresh — persist the
      new one. Scopes comma-separated. | `webhookPing` — push contains only
      `{object_id, owner_id, aspect_type}`. We REST GET the activity. |
      Structural check + optional custom `x-ovok-signature` HMAC. |

      | **Polar** | HTTP **Basic auth** on the token endpoint. Refresh tokens
      **do not rotate**. Requires a post-OAuth `POST /v3/users` registration
      call (we do it for you). | `webhookStream` — full payload arrives inline.
      | Mandatory HMAC-SHA256 in `polar-webhook-signature`. Mismatch = 400. |


      ## FHIR shapes you'll see written


      - **Activities / workouts** → `Procedure` (status: completed) + summary
      `Observation`s for distance (LOINC 55430-3), duration (55411-3), kcal
      (41981-2), avg HR + max HR (8867-4).

      - **Sleep** → `Observation` (LOINC 93832-4) with `effectivePeriod`
      covering bedtime→wake.

      - **Continuous HR** (planned) → `Observation.valueSampledData` — readable
      through `GET /Observation/:id?asTimeseries=true`.


      Every write carries:

      - `meta.project` = the project that owns the connection (tenant
      isolation),

      - `subject` = `Patient/<patient-id>` reference (the connection's
      patientId),

      - `device.display` = `Strava (athlete X)` or `Polar (user X)` (for human
      attribution),

      - `identifier[]` with the provider's external id so downstream replays are
      idempotent.
